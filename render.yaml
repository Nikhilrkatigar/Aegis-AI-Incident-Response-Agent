# Render Blueprint: deploys only the API from the server/ folder of this repo.
# Render dashboard -> New -> Blueprint -> pick this repo. Fill the "sync: false" values when asked.
services:
  - type: web
    name: aegis-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ACTION_SIGNING_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: VERIFY_WINDOW_SEC
        value: "60"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
